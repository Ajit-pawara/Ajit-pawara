name: Generate Snake Animation
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create output directory
        run: mkdir -p output
      
      - name: Generate snake animation
        uses: platane/snk@v3
        with:
          github_user_name: Ajit-pawara
      
      - name: Find and copy snake SVG
        run: |
          echo "=== Root directory ==="
          ls -la *.svg 2>/dev/null || echo "No SVG in root"
          echo "=== All SVG files ==="
          find . -name "*.svg" -type f 2>/dev/null
          
          # Copy generated snake to output/
          if [ -f github-contribution-grid-snake.svg ]; then
            cp github-contribution-grid-snake.svg output/snake.svg
            echo "Copied github-contribution-grid-snake.svg to output/snake.svg"
          elif [ -f snake.svg ]; then
            cp snake.svg output/snake.svg
            echo "Copied snake.svg to output/snake.svg"
          else
            echo "No snake SVG found!"
            exit 1
          fi
      
      - name: Verify output
        run: ls -la output/
      
      - name: Commit snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Update snake animation 🐍"
          git push
